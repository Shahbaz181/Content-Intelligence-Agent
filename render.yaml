services:
  - type: web
    name: content-intelligence-agent-api
    runtime: node
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: HINDSIGHT_BASE_URL
        value: https://api.hindsight.vectorize.io
      - key: CORS_ORIGINS
        sync: false
      - key: HINDSIGHT_BANK_PREFIX
        value: content-intelligence
